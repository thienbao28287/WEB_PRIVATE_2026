<!doctype html>

<body class="bg-hit-canvas font-hit-body text-hit-body">
  <a class="skip" href="#main">Đi đến nội dung</a>
  <header class="header fixed inset-x-0 top-0 flex items-center gap-2 min-[901px]:gap-5 border-b border-hit-line bg-hit-surface intro:hidden">

    <a class="brand" href="#/" aria-label="HIT Web Private 2026 — Trang chủ"><img class="brand-logo" src="./Lesson1/img/logo-02.png" alt="CLB Tin học HIT" width="500" height="500"><span class="brand-name">WEB PRIVATE <small>Tài liệu lớp Web</small></span></a>

    <button id="search-open" class="search-open" aria-label="Tìm kiếm tài liệu"><span class="search-label">Tìm trong tài liệu...</span><kbd>Ctrl K</kbd></button>

  <dialog id="image-dialog" class="image-dialog" aria-label="Xem ảnh lớn"><button class="icon-button" aria-label="Đóng ảnh">✕</button><img alt=""></dialog>
